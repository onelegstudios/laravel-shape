name: tests

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Declared first so it is queued first: the Windows runner is the slowest job
  # in the workflow, so starting it ahead of the Linux matrix keeps it off the
  # critical path.
  #
  # What it covers is the shape:icon:* commands, which do their own filesystem
  # work and are the only part of the package that can pass on Linux and fail
  # here. Two things in particular. Separators: a set's paths come from its own
  # __DIR__, so they arrive backslashed on Windows, and AddIconCommand globs
  # under them and then strips the same prefix back off each result -- if glob
  # hands back the other separator, every name comes out as an absolute path
  # and --all silently publishes nonsense. And line endings: update's unchanged
  # check and check's stamp comparison are byte-identity against a fresh
  # render, so a CRLF checkout reports every icon as drifted. STAMP_PATTERN
  # allows for the \r; this job is what proves it.
  #
  # None of that is reachable from a Linux runner, and neither is the file
  # locking that removing published icons and clearing compiled views runs
  # into. Keep it even though nothing under src/ names an operating system.
  #
  # It runs the same steps as the Linux matrix. It did not until the compiled
  # view path was made per-worker (see Tests\TestCase::compiledViewPath): the
  # icon verbs clear that directory, so under --parallel one worker's publish
  # deleted views another was running on, which POSIX tolerates and Windows
  # does not. Keep the two step lists identical -- a Windows job that tests
  # less than its twin is one whose green is worth less than it looks.
  tests-windows:
    runs-on: windows-latest

    name: P8.5 - L13.* - prefer-stable - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        run: composer test:types

      - name: Test Suite
        run: composer test:unit

  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4, 8.5]
        laravel: [12.*, 13.*]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: PHPStan
        run: composer analyse

      - name: Linter
        run: composer lint:check

      - name: Type Coverage
        run: composer test:types

      - name: Test Suite
        run: composer test:unit
