laravel: '@testbench'

providers:
  - Livewire\Blaze\BlazeServiceProvider
  - Onelegstudios\Shape\ShapeServiceProvider
  # - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: true
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    # Shape ships no icons: an application publishes the ones it renders, and
    # the gallery is an application. Without this step every page that draws an
    # icon fails to resolve <x-shape-icon::default.*> and 500s -- including the
    # button, which renders `spinner` in its loading state.
    #
    # The names are every one the gallery asks for -- the examples in
    # workbench/resources/gallery/*.php and the scheme switcher in its layout --
    # so a page that reaches for a new icon adds it here too. `shape:icon:add`
    # never overwrites, which is what makes re-running the build cheap.
    - shape-icon-add:
        name:
          - arrow-right
          - at-sign
          - check
          - checkbox-check
          - checkbox-indeterminate
          - chevron-down
          - circle-check
          - circle-x
          - download
          - error
          - info
          - menu
          - monitor
          - moon
          - search
          - select-chevron
          - settings
          - sparkles
          - spinner
          - sun
          - trash-2
          - triangle-alert
          - x
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
